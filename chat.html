<!DOCTYPE html>
<html lang="en">

  <!-- =====================================================
       chat.html  —  room chat, styled like site.html
       Sections:  1 Head  ·  2 Styles  ·  3 Sidebar  ·  4 Chat
                  5 Windows (password + join)  ·  6 Script
       ===================================================== -->
 
  <!-- 1. HEAD -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
 
  <!-- Use the theme chosen on the main site (Settings), before the page paints -->
  <script>
    try {
      const s = JSON.parse(localStorage.getItem("bbg_settings2") || "{}");
      const r = document.documentElement;
      r.dataset.theme = s.theme || "black";
      if (s.pulse === false) r.classList.add("no-pulse");
      if (s.glow === false) r.classList.add("no-glow");
    } catch (e) {}
  </script>
 
  <!-- 2. STYLES -->
  <style>
/* ==========================================================================
   1. FONTS & THEME VARIABLES  (same themes as site.html)
   ========================================================================== */
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;600&display=swap');
 
:root {   /* PULSIX RULES light colors */
  --night:#ffffff; --plum:#f1f1f1; --card:#ffffff; --line:#2f2f2f; --text:#2f2f2f; --dim:#5a5a5a;
  --orange:#2f2f2f; --pink:#0a0a0a; --mint:#2f2f2f; --r:22px;
  --blob1:#2f2f2f; --blob2:#2f2f2f; --blob3:#2f2f2f;
  --side:rgba(255,255,255,.92); --panel:rgba(255,255,255,.9); --glow:47,47,47; --on:#ffffff;
}
html[data-theme=pulsixblack] {
  --night:#000000; --plum:#0d0d0d; --card:#0a0a0a; --line:#f2f2f2; --text:#f2f2f2; --dim:#a8a8a8;
  --orange:#f2f2f2; --pink:#bdbdbd; --mint:#f2f2f2; --blob1:#f2f2f2; --blob2:#f2f2f2; --blob3:#f2f2f2;
  --side:rgba(0,0,0,.9); --panel:rgba(0,0,0,.88); --glow:242,242,242; --on:#000000;
}
html[data-theme=neon] {
  --night:#13102b; --plum:#241a4a; --card:#2d2260; --line:rgba(255,255,255,.12); --text:#f6f1ff; --dim:#b3a8d6;
  --orange:#ff8a4c; --pink:#ff5fa2; --mint:#5ef2c4; --blob1:#ff5fa2; --blob2:#ff8a4c; --blob3:#6a4cff;
  --side:rgba(19,16,43,.7); --panel:rgba(45,34,96,.55); --glow:255,95,162; --on:#1a0f2e;
}
html[data-theme=black] {
  --night:#0a0a0a; --plum:#161616; --card:#1d1d1f; --line:rgba(255,255,255,.12); --text:#f2f2f2; --dim:#a1a1a6;
  --orange:#ffffff; --pink:#b4b4ba; --mint:#e6e6e8; --blob1:#4a4a50; --blob2:#2e2e33; --blob3:#55555c;

html[data-theme=blue] {
  --night:#060b1a; --plum:#0e1830; --card:#14224a; --line:rgba(160,190,255,.16); --text:#eef3ff; --dim:#9db0dc;

html[data-theme=pink] {
  --night:#14060f; --plum:#240f1d; --card:#341828; --line:rgba(255,170,210,.16); --text:#fff0f7; --dim:#d9a9c2;

}
 
 
/* ==========================================================================
   2. BASE
   ========================================================================== */
* { box-sizing: border-box; margin: 0; padding: 0; }
 
body {
  font-family: 'DM Sans', system-ui, sans-serif;
  background: var(--night);
  color: var(--dim);
  height: 100vh; height: 100dvh;
  display: flex;
  overflow: hidden;
}
:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
 
 
/* ==========================================================================
   3. BACKGROUND  (drifting glows + 110 BPM pulse, same as site.html)
   ========================================================================== */
.bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.bg i { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .5; animation: drift 26s ease-in-out infinite alternate; }
.bg i:nth-child(1) { width: 46vw; height: 46vw; background: var(--blob1); top: -14vw;    left: -10vw; }
.bg i:nth-child(2) { width: 40vw; height: 40vw; background: var(--blob2); bottom: -16vw; right: -8vw;  animation-delay: -9s;  opacity: .38; }
.bg i:nth-child(3) { width: 34vw; height: 34vw; background: var(--blob3); top: 30%;      left: 45%;    animation-delay: -16s; opacity: .35; }
@keyframes drift { to { transform: translate(8vw, 6vh) scale(1.15); } }
.bg::before, .bg::after { content: ""; position: absolute; inset: -25%; pointer-events: none; }
.bg::after  { background: radial-gradient(circle, transparent 38%, rgba(255,255,255,.075) 58%, transparent 76%); animation: beatRing .5455s cubic-bezier(.3,.6,.4,1) infinite; }
.bg::before { background: radial-gradient(circle at center, rgba(255,255,255,.05), transparent 45%); animation: beatGlow .5455s ease-out infinite; }
@keyframes beatRing { 0% { transform: scale(1.35); opacity: 0; } 25% { opacity: 1; } 100% { transform: scale(.6); opacity: 0; } }
@keyframes beatGlow { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
.no-pulse .bg::before, .no-pulse .bg::after { display: none; }
.no-glow .bg i { animation: none; }
 
 
/* ==========================================================================
   4. SIDEBAR
   ========================================================================== */
aside {
  position: sticky; top: 0;
  height: 100vh; width: 250px; flex-shrink: 0; z-index: 20;
  padding: 22px 16px;
  display: flex; flex-direction: column; gap: 6px;
  background: var(--side); backdrop-filter: blur(18px);
  border-right: 1px solid var(--line);
}
.logo { font: 800 1.5rem/1 'Bricolage Grotesque'; color: var(--text); padding: 4px 10px; white-space: nowrap; }
.logo small { display: block; font: 500 .75rem 'DM Sans'; color: var(--dim); margin-top: 6px; }
 
.nav { display: flex; flex-direction: column; gap: 4px; margin-top: 18px; }
.nav button {
  all: unset; box-sizing: border-box; cursor: pointer;
  padding: 10px 14px; border-radius: 14px;
  color: var(--dim); font-weight: 500; font-size: .95rem;
  display: flex; justify-content: space-between; align-items: center;
  transition: transform .4s cubic-bezier(.3,1.7,.5,1), background .25s, color .25s;
}
.nav button:hover { background: rgba(255,255,255,.08); color: var(--text); transform: translateX(5px); }
.nav button:active { transform: scale(.94); transition-duration: .08s; }
.nav .sub { margin: 14px 14px 4px; font-size: .78rem; color: var(--dim); opacity: .7; }
.nav .on, .nav .on:hover { background: var(--text); color: var(--night); font-weight: 600; }   /* the room you are in */
.nav .on::after { content: "◀"; font-size: .7rem; }
 
.acct { margin-top: auto; border-top: 1px solid var(--line); padding-top: 14px; }
.me { display: flex; align-items: center; gap: 10px; color: var(--text); font-weight: 600; font-size: .9rem; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #64748b; flex-shrink: 0; }
.dot.green { background: #4ade80; }
.dot.orange { background: #facc15; }
.dot.red { background: #ef4444; }
 
 
/* ==========================================================================
   5. BUTTONS + INPUTS
   ========================================================================== */
.btn {
  all: unset; box-sizing: border-box; cursor: pointer; text-align: center;
  padding: 11px 16px; border-radius: 14px; font-weight: 600; font-size: .92rem;
  transition: transform .4s cubic-bezier(.3,1.7,.5,1), box-shadow .25s, filter .2s;
  -webkit-tap-highlight-color: transparent;
}
.btn.main { background: linear-gradient(135deg, var(--orange), var(--pink)); color: var(--on); }
.btn.main:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(var(--glow), .4); }
.btn:active { transform: scale(.92) translateY(1px); filter: brightness(.88); transition-duration: .08s; }
 
input {
  width: 100%; padding: 12px 16px; border-radius: 14px;
  border: 1px solid var(--line); background: rgba(255,255,255,.07);
  color: var(--text); font: 500 1rem 'DM Sans';
}
input::placeholder { color: var(--dim); }
input:focus { outline: none; border-color: var(--mint); box-shadow: 0 0 0 4px rgba(var(--glow), .18); }
html[data-theme=pulsix] input { background: #fff; }
 
 
/* ==========================================================================
   6. CHAT  (messages + input bar)
   ========================================================================== */
main { flex: 1; min-width: 0; position: relative; z-index: 10; padding: 26px clamp(16px, 3vw, 40px) 26px; display: flex; flex-direction: column; }
 
.chat {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
  overflow: hidden; backdrop-filter: blur(14px);
}
.chat-head { padding: 18px 22px; border-bottom: 1px solid var(--line); padding-right: 80px; }   /* room for the Home button */
.chat-head h2 { font: 800 1.6rem 'Bricolage Grotesque'; color: var(--text); letter-spacing: -.02em; }
 
#messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; scrollbar-width: thin; }
.msg-row { display: flex; flex-direction: column; max-width: 80%; animation: rise .3s ease both; }
.msg-row.sent { align-self: flex-end; align-items: flex-end; }
.msg-row.recv { align-self: flex-start; align-items: flex-start; }
.sender-name { font-size: .72rem; color: var(--dim); margin: 0 4px 4px; }
.bubble { padding: 10px 15px; border-radius: 18px; font-size: .95rem; line-height: 1.4; word-wrap: break-word; overflow-wrap: anywhere; }
.sent .bubble { background: linear-gradient(135deg, var(--orange), var(--pink)); color: var(--on); border-bottom-right-radius: 4px; }
.recv .bubble { background: var(--plum); color: var(--text); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.system { align-self: center; font-size: .78rem; color: var(--dim); margin: 6px 0; }
 
.bar { display: flex; gap: 10px; padding: 14px; border-top: 1px solid var(--line); }
.bar .btn { flex-shrink: 0; width: 90px; }
 
 
/* ==========================================================================
   7. WINDOWS  (password + join, same look as the site's log in window)
   ========================================================================== */
.modal {
  position: fixed; inset: 0; z-index: 100; padding: 16px;
  background: rgba(0,0,0,.75); backdrop-filter: blur(8px);
  display: grid; place-items: center;
  opacity: 0; visibility: hidden; transition: opacity .3s ease, visibility 0s .3s;
}
.modal.open { opacity: 1; visibility: visible; transition: opacity .3s ease; }
#gate { z-index: 120; }
html[data-theme=pulsix] .modal { background: rgba(255,255,255,.75); }
 
.box {
  width: 100%; max-width: 380px; padding: 30px; color: var(--dim);
  background: var(--plum); border: 1px solid var(--line); border-radius: 26px;
  transform: translateY(20px) scale(.94); transition: transform .5s cubic-bezier(.2,1.25,.3,1);
}
.modal.open .box { transform: none; }
.box h3 { font: 800 1.6rem 'Bricolage Grotesque'; color: var(--text); margin-bottom: 8px; }
.box p { font-size: .9rem; margin-bottom: 14px; }
.box input { margin-bottom: 10px; }
.box .btn { width: 100%; margin-top: 6px; }
 
.featured { margin-top: 20px; text-align: center; }
.featured p { font-size: .82rem; margin-bottom: 10px; }
.tags { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.tag { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); font-size: .85rem; cursor: pointer; color: var(--dim); transition: .2s; }
.tag:hover { color: var(--text); border-color: var(--dim); }
 
 
/* ==========================================================================
   8. SMALL SCREENS
   ========================================================================== */
@media (max-width: 820px) {
  body { flex-direction: column; }
  aside { position: static; height: auto; width: 100%; flex-direction: row; flex-wrap: wrap; align-items: center; border-right: 0; border-bottom: 1px solid var(--line); }
  .nav { flex-direction: row; flex-wrap: wrap; margin: 0; }
  .nav .sub { display: none; }
  .acct { margin: 0 0 0 auto; border: 0; padding: 0; }
  main { min-height: 0; padding: 14px; }
}
  </style>
</head>
 
<body>
 
  <div class="bg"><i></i><i></i><i></i></div>
 
 
  <!-- ======================= 3. SIDEBAR ======================= -->
  <aside>
    <div class="logo">pulsixgames<small>chat</small></div>
 
    <nav class="nav">
      <button id="back">← Back to games</button>
 
      <div class="sub">Rooms</div>
      <button data-room="lobby"># lobby</button>
      <button data-room="gaming"># gaming</button>
      <button data-room="music"># music</button>
      <button data-room="random"># random</button>
      <button id="leave" style="display:none">Leave room</button>
    </nav>
 
    <div class="acct"><div class="me"><span class="dot" id="status-dot"></span><span id="peer-count">Offline</span></div></div>
  </aside>
 
 
  <!-- ========================= 4. CHAT ========================= -->
  <main>
    <div class="chat">
      <div class="chat-head"><h2 id="room-display">#Lobby</h2></div>
      <div id="messages"></div>
      <div class="bar">
        <input type="text" id="msg-input" placeholder="Message..." autocomplete="off">
        <button class="btn main" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </main>
 
 
  <!-- ======================= 5. WINDOWS ======================= -->
 
  <!-- site password -->
  <div class="modal open" id="gate">
    <div class="box">
      <h3>Private access</h3>
      <p>Enter the site password to continue.</p>
      <input type="password" id="site-password" placeholder="Password">
      <button class="btn main" onclick="checkSitePassword()">Unlock</button>
    </div>
  </div>
 
  <!-- join a room -->
  <div class="modal open" id="login-screen">
    <div class="box">
      <h3>Global chat</h3>
      <p>Join a room</p>
      <input type="text" id="username" placeholder="Nickname" maxlength="60">
      <input type="text" id="room" placeholder="Room name (e.g. lobby)">
      <button class="btn main" onclick="joinChat()">Start chatting</button>
 
      <div class="featured">
        <p>Or join a popular space:</p>
        <div class="tags">
          <span class="tag" onclick="quickJoin('lobby')">#lobby</span>
          <span class="tag" onclick="quickJoin('gaming')">#gaming</span>
          <span class="tag" onclick="quickJoin('music')">#music</span>
          <span class="tag" onclick="quickJoin('random')">#random</span>
        </div>
      </div>
    </div>
  </div>

/* ==========================================================================
   2. PASSWORD + QUICK JOIN
   ========================================================================== */
function checkSitePassword() {
  if ($('#site-password').value === SITE_ACCESS_PASSWORD) {
    $('#gate').classList.remove('open');
    setTimeout(() => $('#username').focus(), 300);
  } else {
    alert("Access Denied: Incorrect Password");
    $('#site-password').value = '';
  }
}
$('#site-password').addEventListener('keypress', e => { if (e.key === 'Enter') checkSitePassword(); });
 
// room buttons (sidebar + join window): fill in the room, then join if we already have a nickname
function quickJoin(roomName) {
  if (peer) leaveRoom();
  $('#room').value = roomName;
  if ($('#username').value.trim()) joinChat();
  else $('#username').focus();
}
document.querySelectorAll('[data-room]').forEach(b => b.onclick = () => quickJoin(b.dataset.room));
 
// back to the games menu (works inside the site's game viewer or on its own)
$('#back').onclick = () => {
  try { if (parent !== window) return parent.document.getElementById('homeBtn').click(); } catch (e) {}
  location.href = './site.html';
};
 
 
/* ==========================================================================
   3. CHAT
   ========================================================================== */
let peer;
let myId, myName, roomId;
let connections = {};
let seenIds = new Set();
let isHost = false;
let hostTimer;                 // waits for a host to answer, then we become the host ourselves
 
const peerConfig = {
  debug: 0,   // keeps PeerJS quiet in the console
  config: {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      // Add your TURN server here once you have one (a placeholder address fills the console with errors, so it is switched off):
      // { urls: 'turn:YOUR-TURN-SERVER:443', username: 'YOUR-USERNAME', credential: 'YOUR-PASSWORD' }
    ]
  }
};
 
function censorMessage(text) {
  let cleanText = text;
  BANNED_WORDS.forEach(word => {
    const regex = new RegExp(`\\b${word}\\b`, 'gi');
    cleanText = cleanText.replace(regex, '*'.repeat(word.length));
  });
  return cleanText;
}
 
// highlights the sidebar button for the room you are in (none for a custom room name)
const markRoom = name => document.querySelectorAll('[data-room]').forEach(b => b.classList.toggle('on', b.dataset.room === name));
 
function joinChat() {
  myName = $('#username').value.trim();
  const r = $('#room').value.trim().toLowerCase();
  if (!myName || !r) return alert("Nickname and Room are required!");
 
  roomId = "chat-room-" + r.replace(/[^a-z0-9]/g, '');
  $('#room-display').textContent = "#" + r;
  $('#login-screen').classList.remove('open');
  $('#leave').style.display = '';
  markRoom(r.replace(/[^a-z0-9]/g, ''));
  setStatus("Connecting...", "orange");
  initPeer(false);
}
 
function leaveRoom() {
  clearTimeout(hostTimer);
  if (peer) { peer.destroy(); peer = null; }
  connections = {};
  seenIds.clear();
  isHost = false;
 
  $('#messages').innerHTML = '';
  $('#login-screen').classList.add('open');
  $('#leave').style.display = 'none';
  markRoom('');
  $('#room-display').textContent = "#Lobby";
  setStatus("Offline", "");
}
$('#leave').onclick = leaveRoom;
 
function initPeer(forceHost = false) {
  const id = forceHost ? roomId : null;
  clearTimeout(hostTimer);
  if (peer) peer.destroy();
  peer = new Peer(id, peerConfig);
 
  peer.on('open', id => {
    myId = id;
    if (myId === roomId) {
      isHost = true;
      setStatus("Hosting Room", "green");
      renderSystemMessage({ text: "You are the host." });
    } else {
      connectToHost();
    }
  });
 
  peer.on('connection', conn => setupConn(conn));
 
  peer.on('error', err => {
    console.log("Peer Error:", err.type);
    if (err.type === 'unavailable-id') {
      isHost = false;
      initPeer(false);
    } else if (err.type === 'peer-unavailable') {   // nobody is hosting this room yet, so we host it
      if (!isHost) initPeer(true);
    } else if (err.type === 'network' || err.type === 'disconnected') {
      setStatus("Connection Lost", "red");
    }
  });
}
 
function broadcast(data) {
  Object.values(connections).forEach(c => { if (c.open) c.send(data); });
}
 
// host only
function broadcastSystem(message) {
  const payload = { id: Date.now() + Math.random().toString(), type: 'system', text: message };
  seenIds.add(payload.id);
  broadcast(payload);
  renderSystemMessage(payload);
}
 
function connectToHost() {
  setStatus("Finding Host...", "orange");
  const conn = peer.connect(roomId, { reliable: true });
  let connected = false;
 
  conn.on('open', () => {
    connected = true;
    setStatus("Connected", "green");
    setupConn(conn);
  });
 
  hostTimer = setTimeout(() => { if (!connected && !isHost) initPeer(true); }, 5000);
}
 
function setupConn(c) {
  connections[c.peer] = c;
  updateCount();
 
  if (isHost) broadcastSystem("A new user joined the chat.");
 
  c.on('data', data => {
    if (seenIds.has(data.id)) return;
    seenIds.add(data.id);
 
    if (data.type === 'system') return renderSystemMessage(data);
    if (isHost) broadcast(data);
    renderMessage(data);
  });
 
  c.on('close', () => { delete connections[c.peer]; updateCount(); });
}
 
function sendMessage() {
  const txt = $('#msg-input').value.trim();
  if (!txt) return;
 
  const payload = { id: Date.now() + Math.random().toString(), name: myName, text: censorMessage(txt) };
  seenIds.add(payload.id);
  broadcast(payload);
  renderMessage(payload, true);
  $('#msg-input').value = '';
}
 
// messages are shown with textContent, so nothing a user types can run as HTML
function renderMessage(data, isMe = false) {
  const box = $('#messages');
  const row = document.createElement('div');
  row.className = `msg-row ${isMe ? 'sent' : 'recv'}`;
 
  const name = document.createElement('div');
  name.className = 'sender-name';
  name.textContent = isMe ? 'You' : data.name;
 
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = data.text;
 
  row.append(name, bubble);
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
}
 
function renderSystemMessage(data) {
  const box = $('#messages');
  const div = document.createElement('div');
  div.className = 'system';
  div.textContent = data.text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}
 
function setStatus(msg, color) {
  $('#peer-count').textContent = msg;
  $('#status-dot').className = "dot " + color;
}
 
function updateCount() {
  if (!isHost) return;
  $('#peer-count').textContent = `${Object.keys(connections).length} Peers Connected`;
}
 
$('#msg-input').addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
  </script>
</body>
</html>
