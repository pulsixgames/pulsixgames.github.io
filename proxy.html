<!DOCTYPE html>
<html lang="en">
<head>

  <!-- =====================================================
       proxy.html  —  browse any website through proxy-server.js
       Sections:  1 Head  ·  2 Styles  ·  3 Sidebar  ·  4 Browser  ·  5 Script
       (needs proxy-server.js running somewhere: see the top of that file)
       ===================================================== -->

  <!-- 1. HEAD -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Proxy</title>

  <!-- Use the theme chosen on the main site (Settings), before the page paints -->
  <script>
    try {
      const s = JSON.parse(localStorage.getItem("bbg_settings2") || "{}");
      const r = document.documentElement;
      r.dataset.theme = s.theme || "black";
      if (s.pulse === false) r.classList.add("no-pulse");
      if (s.glow === false) r.classList.add("no-glow");
    } catch (e) {}
  </script>

  <!-- 2. STYLES -->
  <style>
/* ==========================================================================
   1. FONTS & THEME VARIABLES  (same themes and sidebar as site.html)
   ========================================================================== */
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;600&display=swap');

:root {   /* PULSIX RULES light colors */
  --night:#ffffff; --plum:#f1f1f1; --card:#ffffff; --line:#2f2f2f; --text:#2f2f2f; --dim:#5a5a5a;
  --orange:#2f2f2f; --pink:#0a0a0a; --mint:#2f2f2f; --r:22px;
  --blob1:#2f2f2f; --blob2:#2f2f2f; --blob3:#2f2f2f;
  --side:rgba(255,255,255,.92); --panel:rgba(255,255,255,.9); --glow:47,47,47; --on:#ffffff;
}
html[data-theme=pulsixblack] {
  --night:#000000; --plum:#0d0d0d; --card:#0a0a0a; --line:#f2f2f2; --text:#f2f2f2; --dim:#a8a8a8;
  --orange:#f2f2f2; --pink:#bdbdbd; --mint:#f2f2f2; --blob1:#f2f2f2; --blob2:#f2f2f2; --blob3:#f2f2f2;
  --side:rgba(0,0,0,.9); --panel:rgba(0,0,0,.88); --glow:242,242,242; --on:#000000;
}
html[data-theme=neon] {
  --night:#13102b; --plum:#241a4a; --card:#2d2260; --line:rgba(255,255,255,.12); --text:#f6f1ff; --dim:#b3a8d6;
  --orange:#ff8a4c; --pink:#ff5fa2; --mint:#5ef2c4; --blob1:#ff5fa2; --blob2:#ff8a4c; --blob3:#6a4cff;
  --side:rgba(19,16,43,.7); --panel:rgba(45,34,96,.55); --glow:255,95,162; --on:#1a0f2e;
}
html[data-theme=black] {
  --night:#0a0a0a; --plum:#161616; --card:#1d1d1f; --line:rgba(255,255,255,.12); --text:#f2f2f2; --dim:#a1a1a6;
  --orange:#ffffff; --pink:#b4b4ba; --mint:#e6e6e8; --blob1:#4a4a50; --blob2:#2e2e33; --blob3:#55555c;
  --side:rgba(10,10,10,.7); --panel:rgba(30,30,32,.55); --glow:180,180,190; --on:#0a0a0a;
}
html[data-theme=blue] {
  --night:#060b1a; --plum:#0e1830; --card:#14224a; --line:rgba(160,190,255,.16); --text:#eef3ff; --dim:#9db0dc;
  --orange:#9fd0ff; --pink:#4d7cff; --mint:#8fc0ff; --blob1:#2b57ff; --blob2:#1a3a9c; --blob3:#3d8bff;
  --side:rgba(6,11,26,.72); --panel:rgba(20,34,74,.55); --glow:77,124,255; --on:#06102a;
}
html[data-theme=pink] {
  --night:#14060f; --plum:#240f1d; --card:#341828; --line:rgba(255,170,210,.16); --text:#fff0f7; --dim:#d9a9c2;
  --orange:#ffc2dd; --pink:#ff4d94; --mint:#ffb3d4; --blob1:#ff4d94; --blob2:#a02a68; --blob3:#ff8fb8;
  --side:rgba(20,6,15,.72); --panel:rgba(52,24,40,.55); --glow:255,77,148; --on:#2a0716;
}


/* ==========================================================================
   2. BASE
   ========================================================================== */
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', system-ui, sans-serif;
  background: var(--night);
  color: var(--dim);
  height: 100vh; height: 100dvh;
  display: flex;
  overflow: hidden;
}
:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }


/* ==========================================================================
   3. BACKGROUND  (drifting glows + 110 BPM pulse, same as site.html)
   ========================================================================== */
.bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.bg i { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .5; animation: drift 26s ease-in-out infinite alternate; }
.bg i:nth-child(1) { width: 46vw; height: 46vw; background: var(--blob1); top: -14vw;    left: -10vw; }
.bg i:nth-child(2) { width: 40vw; height: 40vw; background: var(--blob2); bottom: -16vw; right: -8vw;  animation-delay: -9s;  opacity: .38; }
.bg i:nth-child(3) { width: 34vw; height: 34vw; background: var(--blob3); top: 30%;      left: 45%;    animation-delay: -16s; opacity: .35; }
@keyframes drift { to { transform: translate(8vw, 6vh) scale(1.15); } }
.bg::before, .bg::after { content: ""; position: absolute; inset: -25%; pointer-events: none; }
.bg::after  { background: radial-gradient(circle, transparent 38%, rgba(255,255,255,.075) 58%, transparent 76%); animation: beatRing .5455s cubic-bezier(.3,.6,.4,1) infinite; }
.bg::before { background: radial-gradient(circle at center, rgba(255,255,255,.05), transparent 45%); animation: beatGlow .5455s ease-out infinite; }
@keyframes beatRing { 0% { transform: scale(1.35); opacity: 0; } 25% { opacity: 1; } 100% { transform: scale(.6); opacity: 0; } }
@keyframes beatGlow { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
.no-pulse .bg::before, .no-pulse .bg::after { display: none; }
.no-glow .bg i { animation: none; }


/* ==========================================================================
   4. SIDEBAR
   ========================================================================== */
aside {
  position: sticky; top: 0;
  height: 100vh; width: 250px; flex-shrink: 0; z-index: 20;
  padding: 22px 16px;
  display: flex; flex-direction: column; gap: 6px;
  background: var(--side); backdrop-filter: blur(18px);
  border-right: 1px solid var(--line);
}
.logo { font: 800 1.5rem/1 'Bricolage Grotesque'; color: var(--text); padding: 4px 10px; white-space: nowrap; }
.logo small { display: block; font: 500 .75rem 'DM Sans'; color: var(--dim); margin-top: 6px; }

.nav { display: flex; flex-direction: column; gap: 4px; margin-top: 18px; }
.nav button {
  all: unset; box-sizing: border-box; cursor: pointer;
  padding: 10px 14px; border-radius: 14px;
  color: var(--dim); font-weight: 500; font-size: .95rem;
  display: flex; justify-content: space-between; align-items: center;
  transition: transform .4s cubic-bezier(.3,1.7,.5,1), background .25s, color .25s;
}
.nav button:hover { background: rgba(255,255,255,.08); color: var(--text); transform: translateX(5px); }
.nav button:active { transform: scale(.94); transition-duration: .08s; }
.nav .sub { margin: 14px 14px 4px; font-size: .78rem; color: var(--dim); opacity: .7; }
.nav .on, .nav .on:hover { background: var(--text); color: var(--night); font-weight: 600; }   /* the room you are in */
.nav .on::after { content: "◀"; font-size: .7rem; }

.acct { margin-top: auto; border-top: 1px solid var(--line); padding-top: 14px; }
.me { display: flex; align-items: center; gap: 10px; color: var(--text); font-weight: 600; font-size: .9rem; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #64748b; flex-shrink: 0; }
.dot.green { background: #4ade80; }
.dot.orange { background: #facc15; }
.dot.red { background: #ef4444; }


/* ==========================================================================
   5. BUTTONS + INPUTS
   ========================================================================== */
.btn {
  all: unset; box-sizing: border-box; cursor: pointer; text-align: center;
  padding: 11px 16px; border-radius: 14px; font-weight: 600; font-size: .92rem;
  transition: transform .4s cubic-bezier(.3,1.7,.5,1), box-shadow .25s, filter .2s;
  -webkit-tap-highlight-color: transparent;
}
.btn.main { background: linear-gradient(135deg, var(--orange), var(--pink)); color: var(--on); }
.btn.main:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(var(--glow), .4); }
.btn:active { transform: scale(.92) translateY(1px); filter: brightness(.88); transition-duration: .08s; }

input {
  width: 100%; padding: 12px 16px; border-radius: 14px;
  border: 1px solid var(--line); background: rgba(255,255,255,.07);
  color: var(--text); font: 500 1rem 'DM Sans';
}
input::placeholder { color: var(--dim); }
input:focus { outline: none; border-color: var(--mint); box-shadow: 0 0 0 4px rgba(var(--glow), .18); }
html[data-theme=pulsix] input { background: #fff; }



/* ==========================================================================
   6. BROWSER  (address bar + page view)
   ========================================================================== */
main { flex: 1; min-width: 0; position: relative; z-index: 10; padding: 26px clamp(16px, 3vw, 40px); display: flex; flex-direction: column; gap: 14px; }

.toolbar { display: flex; gap: 8px; align-items: center; padding-right: 70px; }   /* room for the Home button */
.toolbar .btn { flex-shrink: 0; }
.btn.ghost { background: rgba(255,255,255,.08); color: var(--text); width: 44px; padding: 11px 0; }
.btn.ghost:hover { background: rgba(255,255,255,.16); }
html[data-theme=pulsix] .btn.ghost { background: rgba(47,47,47,.07); }
#addr { flex: 1; min-width: 0; border-radius: 999px; padding: 13px 20px; }

.view { flex: 1; min-height: 0; position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; backdrop-filter: blur(14px); }
.view iframe { display: none; width: 100%; height: 100%; border: 0; background: #fff; }
.view.loaded iframe { display: block; }

.home { position: absolute; inset: 0; display: grid; place-content: center; gap: 10px; padding: 24px; text-align: center; }
.view.loaded .home { display: none; }
.home h2 { font: 800 clamp(1.8rem, 4vw, 2.6rem) 'Bricolage Grotesque'; color: var(--text); letter-spacing: -.02em; }
.warn { color: #ff8fa8; font-size: .9rem; max-width: 420px; }

@media (max-width: 820px) {
  body { flex-direction: column; }
  aside { position: static; height: auto; width: 100%; flex-direction: row; flex-wrap: wrap; align-items: center; border-right: 0; border-bottom: 1px solid var(--line); }
  .nav { flex-direction: row; flex-wrap: wrap; margin: 0; }
  .nav .sub { display: none; }
  .acct { margin: 0 0 0 auto; border: 0; padding: 0; }
  main { min-height: 0; padding: 14px; }
}
  </style>
</head>

<body>

  <div class="bg"><i></i><i></i><i></i></div>


  <!-- ======================= 3. SIDEBAR ======================= -->
  <aside>
    <div class="logo">pulsixgames<small>proxy</small></div>

    <nav class="nav">
      <button id="back">← Back to games</button>

      <div class="sub">Quick links</div>
      <button data-go="duckduckgo.com">DuckDuckGo</button>
      <button data-go="wikipedia.org">Wikipedia</button>
      <button data-go="news.ycombinator.com">Hacker News</button>
    </nav>

    <div class="acct"><div class="me"><span class="dot" id="status-dot"></span><span id="status">Checking...</span></div></div>
  </aside>


  <!-- ======================= 4. BROWSER ======================= -->
  <main>
    <div class="toolbar">
      <button class="btn ghost" id="bk" aria-label="Back">←</button>
      <button class="btn ghost" id="fw" aria-label="Forward">→</button>
      <button class="btn ghost" id="rl" aria-label="Reload">⟳</button>
      <input id="addr" placeholder="Search or enter a website" autocomplete="off" spellcheck="false">
      <button class="btn main" id="go">Go</button>
    </div>

    <div class="view" id="view">
      <div class="home">
        <h2>Browse anything</h2>
        <p>Type a website or a search above, or pick a quick link.</p>
        <p class="warn" id="warn"></p>
      </div>
      <iframe id="frame" title="Page"></iframe>
    </div>
  </main>


  <!-- ======================= 5. SCRIPT ======================= -->
  <script>
const $ = s => document.querySelector(s);

/* ==========================================================================
   SETTINGS
   SERVER = the address of your proxy server once it is online (see proxy-server.js),
   for example 'https://pulsix-proxy.onrender.com'  (no slash at the end).
   ========================================================================== */
const SERVER = 'https://pulsix-proxy.onrender.com';
const PROXY  = SERVER + '/proxy?url=';
const PING   = SERVER + '/ping';
const SEARCH = 'https://duckduckgo.com/html/?q=';   // used when you type words instead of an address


/* ==========================================================================
   BROWSING
   ========================================================================== */
// "wikipedia.org" -> https://wikipedia.org,  "cute cats" -> a search
function toUrl(text) {
  text = text.trim();
  if (!text) return '';
  if (/^https?:\/\//i.test(text)) return text;
  if (!/\s/.test(text) && /^[\w-]+(\.[\w-]+)+(:\d+)?([\/?#].*)?$/.test(text)) return 'https://' + text;
  return SEARCH + encodeURIComponent(text);
}

// shows a page in the frame
function load(url) {
  $('#addr').value = url;
  $('#view').classList.add('loaded');
  $('#frame').src = PROXY + encodeURIComponent(url);
}

// back / forward: the proxy tells us every page you land on, so this works even when the server is at another address
const trail = [];
let at = -1, moving = false;
const visit = url => { trail.splice(at + 1); trail.push(url); at = trail.length - 1; };

function go(text) {
  const url = toUrl(text);
  if (!url) return;
  visit(url);
  load(url);
}

window.addEventListener('message', e => {
  if (e.source !== $('#frame').contentWindow || !e.data || !e.data.proxyUrl) return;
  const url = e.data.proxyUrl;
  $('#addr').value = url;                      // keep the address bar showing the real address
  if (moving) moving = false;
  else if (trail[at] !== url) visit(url);      // a link you clicked inside the page
});

function step(d) {
  const i = at + d;
  if (i < 0 || i >= trail.length) return;
  at = i; moving = true;
  load(trail[i]);
}

$('#bk').onclick = () => step(-1);
$('#fw').onclick = () => step(1);
$('#rl').onclick = () => { if (trail[at]) load(trail[at]); };
$('#go').onclick = () => go($('#addr').value);
$('#addr').addEventListener('keydown', e => { if (e.key === 'Enter') go($('#addr').value); });
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));

// back to the games menu (works inside the site's game viewer or on its own)
$('#back').onclick = () => {
  try { if (parent !== window) return parent.document.getElementById('homeBtn').click(); } catch (e) {}
  location.href = './site.html';
};


/* ==========================================================================
   IS THE PROXY SERVER THERE?
   ========================================================================== */
const setStatus = (msg, color) => { $('#status').textContent = msg; $('#status-dot').className = 'dot ' + color; };

fetch(PING).then(r => { if (!r.ok) throw 0; setStatus('Proxy ready', 'green'); }).catch(() => {
  setStatus('Proxy offline', 'red');
  $('#warn').textContent = "The proxy server was not found. Put your server's address in SERVER at the top of this script (and make sure the server is running).";
});
  </script>
</body>
</html>
