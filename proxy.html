<!DOCTYPE html>
<html lang="en">
<head>

  <!-- =====================================================
       proxy.html  —  browse any website through proxy-server.js
       Sections:  1 Head  ·  2 Styles  ·  3 Sidebar  ·  4 Browser  ·  5 Script
       (needs proxy-server.js running somewhere: see the top of that file)
       ===================================================== -->

  <!-- 1. HEAD -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Proxy</title>

  <!-- Use the theme chosen on the main site (Settings), before the page paints -->
  <script>
    try {
      const s = JSON.parse(localStorage.getItem("bbg_settings2") || "{}");
      const r = document.documentElement;
      r.dataset.theme = s.theme || "black";
      if (s.pulse === false) r.classList.add("no-pulse");
      if (s.glow === false) r.classList.add("no-glow");
    } catch (e) {}
  </script>

  <!-- 2. STYLES -->
  <style>
/* ==========================================================================
   1. FONTS & THEME VARIABLES  (same themes and sidebar as site.html)
   ========================================================================== */
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;600&display=swap');

:root {   /* PULSIX RULES light colors */
  --night:#ffffff; --plum:#f1f1f1; --card:#ffffff; --line:#2f2f2f; --text:#2f2f2f; --dim:#5a5a5a;
  --orange:#2f2f2f; --pink:#0a0a0a; --mint:#2f2f2f; --r:22px;
  --blob1:#2f2f2f; --blob2:#2f2f2f; --blob3:#2f2f2f;
  --side:rgba(255,255,255,.92); --panel:rgba(255,255,255,.9); --glow:47,47,47; --on:#ffffff;
}
html[data-theme=pulsixblack] {
  --night:#000000; --plum:#0d0d0d; --card:#0a0a0a; --line:#f2f2f2; --text:#f2f2f2; --dim:#a8a8a8;
  --orange:#f2f2f2; --pink:#bdbdbd; --mint:#f2f2f2; --blob1:#f2f2f2; --blob2:#f2f2f2; --blob3:#f2f2f2;
  --side:rgba(0,0,0,.9); --panel:rgba(0,0,0,.88); --glow:242,242,242; --on:#000000;
}
html[data-theme=neon] {
  --night:#13102b; --plum:#241a4a; --card:#2d2260; --line:rgba(255,255,255,.12); --text:#f6f1ff; --dim:#b3a8d6;
  --orange:#ff8a4c; --pink:#ff5fa2; --mint:#5ef2c4; --blob1:#ff5fa2; --blob2:#ff8a4c; --blob3:#6a4cff;
  --side:rgba(19,16,43,.7); --panel:rgba(45,34,96,.55); --glow:255,95,162; --on:#1a0f2e;
}
html[data-theme=black] {
  --night:#0a0a0a; --plum:#161616; --card:#1d1d1f; --line:rgba(255,255,255,.12); --text:#f2f2f2; --dim:#a1a1a6;
  --orange:#ffffff; --pink:#b4b4ba; --mint:#e6e6e8; --blob1:#4a4a50; --blob2:#2e2e33; --blob3:#55555c;
  --side:rgba(10,10,10,.7); --panel:rgba(30,30,32,.55); --glow:180,180,190; --on:#0a0a0a;
}
html[data-theme=blue] {
  --night:#060b1a; --plum:#0e1830; --card:#14224a; --line:rgba(160,190,255,.16); --text:#eef3ff; --dim:#9db0dc;
  --orange:#9fd0ff; --pink:#4d7cff; --mint:#8fc0ff; --blob1:#2b57ff; --blob2:#1a3a9c; --blob3:#3d8bff;
  --side:rgba(6,11,26,.72); --panel:rgba(20,34,74,.55); --glow:77,124,255; --on:#06102a;
}
html[data-theme=pink] {
  --night:#14060f; --plum:#240f1d; --card:#341828; --line:rgba(255,170,210,.16); --text:#fff0f7; --dim:#d9a9c2;
  --orange:#ffc2dd; --pink:#ff4d94; --mint:#ffb3d4; --blob1:#ff4d94; --blob2:#a02a68; --blob3:#ff8fb8;
  --side:rgba(20,6,15,.72); --panel:rgba(52,24,40,.55); --glow:255,77,148; --on:#2a0716;
}


/* ==========================================================================
   2. BASE
   ========================================================================== */
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', system-ui, sans-serif;
  background: var(--night);
  color: var(--dim);
  height: 100vh; height: 100dvh;
  display: flex;
  overflow: hidden;
}
:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }


/* ==========================================================================
   3. BACKGROUND  (drifting glows + 110 BPM pulse, same as site.html)
   ========================================================================== */
.bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.bg i { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .5; animation: drift 26s ease-in-out infinite alternate; }
.bg i:nth-child(1) { width: 46vw; height: 46vw; background: var(--blob1); top: -14vw;    left: -10vw; }
.bg i:nth-child(2) { width: 40vw; height: 40vw; background: var(--blob2); bottom: -16vw; right: -8vw;  animation-delay: -9s;  opacity: .38; }
.bg i:nth-child(3) { width: 34vw; height: 34vw; background: var(--blob3); top: 30%;      left: 45%;    animation-delay: -16s; opacity: .35; }
@keyframes drift { to { transform: translate(8vw, 6vh) scale(1.15); } }
.bg::before, .bg::after { content: ""; position: absolute; inset: -25%; pointer-events: none; }
.bg::after  { background: radial-gradient(circle, transparent 38%, rgba(255,255,255,.075) 58%, transparent 76%); animation: beatRing .5455s cubic-bezier(.3,.6,.4,1) infinite; }
.bg::before { background: radial-gradient(circle at center, rgba(255,255,255,.05), transparent 45%); animation: beatGlow .5455s ease-out infinite; }
@keyframes beatRing { 0% { transform: scale(1.35); opacity: 0; } 25% { opacity: 1; } 100% { transform: scale(.6); opacity: 0; } }
@keyframes beatGlow { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
.no-pulse .bg::before, .no-pulse .bg::after { display: none; }
.no-glow .bg i { animation: none; }


/* ==========================================================================
   4. SIDEBAR
   ========================================================================== */
aside {
  position: sticky; top: 0;
  height: 100vh; width: 250px; flex-shrink: 0; z-index: 20;
  padding: 22px 16px;
  display: flex; flex-direction: column; gap: 6px;
  background: var(--side); backdrop-filter: blur(18px);
  border-right: 1px solid var(--line);
}
.logo { font: 800 1.5rem/1 'Bricolage Grotesque'; color: var(--text); padding: 4px 10px; white-space: nowrap; }
.logo small { display: block; font: 500 .75rem 'DM Sans'; color: var(--dim); margin-top: 6px; }

.nav { display: flex; flex-direction: column; gap: 4px; margin-top: 18px; }
.nav button {
  all: unset; box-sizing: border-box; cursor: pointer;
  padding: 10px 14px; border-radius: 14px;
  color: var(--dim); font-weight: 500; font-size: .95rem;
  display: flex; justify-content: space-between; align-items: center;
  transition: transform .4s cubic-bezier(.3,1.7,.5,1), background .25s, color .25s;
}
.nav button:hover { background: rgba(255,255,255,.08); color: var(--text); transform: translateX(5px); }
.nav button:active { transform: scale(.94); transition-duration: .08s; }
.nav .sub { margin: 14px 14px 4px; font-size: .78rem; color: var(--dim); opacity: .7; }
.nav .on, .nav .on:hover { background: var(--text); color: var(--night); font-weight: 600; }   /* the room you are in */
.nav .on::after { content: "◀"; font-size: .7rem; }

.acct { margin-top: auto; border-top: 1px solid var(--line); padding-top: 14px; }
.me { display: flex; align-items: center; gap: 10px; color: var(--text); font-weight: 600; font-size: .9rem; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #64748b; flex-shrink: 0; }
.dot.green { background: #4ade80; }
.dot.orange { background: #facc15; }
.dot.red { background: #ef4444; }


/* ==========================================================================
   5. BUTTONS + INPUTS
   ========================================================================== */
.btn {
  all: unset; box-sizing: border-box; cursor: pointer; text-align: center;
  padding: 11px 16px; border-radius: 14px; font-weight: 600; font-size: .92rem;
  transition: transform .4s cubic-bezier(.3,1.7,.5,1), box-shadow .25s, filter .2s;
  -webkit-tap-highlight-color: transparent;
}
.btn.main { background: linear-gradient(135deg, var(--orange), var(--pink)); color: var(--on); }
.btn.main:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(var(--glow), .4); }
.btn:active { transform: scale(.92) translateY(1px); filter: brightness(.88); transition-duration: .08s; }

input {
  width: 100%; padding: 12px 16px; border-radius: 14px;
  border: 1px solid var(--line); background: rgba(255,255,255,.07);
  color: var(--text); font: 500 1rem 'DM Sans';
}
input::placeholder { color: var(--dim); }
input:focus { outline: none; border-color: var(--mint); box-shadow: 0 0 0 4px rgba(var(--glow), .18); }
html[data-theme=pulsix] input { background: #fff; }



/* ==========================================================================
   6. BROWSER  (address bar + page view)
   ========================================================================== */
main { flex: 1; min-width: 0; position: relative; z-index: 10; padding: 26px clamp(16px, 3vw, 40px); display: flex; flex-direction: column; gap: 14px; }

.toolbar { display: flex; gap: 8px; align-items: center; padding-right: 70px; }   /* room for the Home button */
.toolbar .btn { flex-shrink: 0; }
.btn.ghost { background: rgba(255,255,255,.08); color: var(--text); width: 44px; padding: 11px 0; }
.btn.ghost:hover { background: rgba(255,255,255,.16); }
html[data-theme=pulsix] .btn.ghost { background: rgba(47,47,47,.07); }
#addr { flex: 1; min-width: 0; border-radius: 999px; padding: 13px 20px; }

.view { flex: 1; min-height: 0; position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; backdrop-filter: blur(14px); }
.view iframe { display: none; position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
.view iframe.on { display: block; animation: fadein .3s ease both; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.view.busy::after { content: ""; position: absolute; top: 0; left: 0; width: 40%; height: 3px; z-index: 6; background: var(--mint); animation: slide 1s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

.home { position: absolute; inset: 0; display: none; place-content: center; gap: 12px; padding: 24px; text-align: center; }
.home.show { display: grid; animation: rise .4s ease both; }
.home h2 { font: 800 clamp(1.8rem, 4vw, 2.6rem) 'Bricolage Grotesque'; color: var(--text); letter-spacing: -.02em; }
.warn { color: #ff8fa8; font-size: .9rem; max-width: 420px; margin-inline: auto; }
.setup { display: none; gap: 8px; width: min(440px, 100%); margin: 6px auto 0; }
.setup.show { display: flex; }
.setup input { flex: 1; min-width: 0; }
.home > input { width: min(480px, 100%); margin-inline: auto; border-radius: 999px; padding: 13px 20px; }

/* tab bar */
.tabbar { display: flex; gap: 6px; align-items: center; padding-right: 70px; }   /* room for the Home button */
.tabs { display: flex; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 1 190px; min-width: 120px; display: flex; align-items: center; gap: 8px;
  padding: 8px 8px 8px 12px; border-radius: 12px; border: 1px solid transparent;
  background: rgba(255,255,255,.04); color: var(--dim); font-size: .82rem; cursor: pointer; user-select: none;
  overflow: hidden;
  transition: background .2s, color .2s, border-color .2s, flex-basis .3s cubic-bezier(.2,.9,.25,1), min-width .3s cubic-bezier(.2,.9,.25,1),
              padding .3s cubic-bezier(.2,.9,.25,1), opacity .25s, transform .3s cubic-bezier(.2,.9,.25,1);
}
.tab:hover { background: rgba(255,255,255,.1); color: var(--text); transform: translateY(-1px); }
.tab.enter, .tab.leaving { flex-basis: 0; min-width: 0; padding-inline: 0; opacity: 0; transform: scale(.85); }   /* grows in / shrinks away */
.tab.leaving { pointer-events: none; }
.tab.on { background: var(--panel); color: var(--text); border-color: var(--mint); font-weight: 600; }
html[data-theme=pulsix] .tab { background: rgba(47,47,47,.05); }
html[data-theme=pulsix] .tab:hover { background: rgba(47,47,47,.1); }
.tab .ico { width: 16px; height: 16px; flex-shrink: 0; display: grid; place-items: center; font-size: .8rem; }
.tab .ico img { width: 16px; height: 16px; object-fit: contain; border-radius: 3px; }
.tab.loading .ico::before { content: ""; width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--mint); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.tab .ttl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab .x { all: unset; flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 1rem; line-height: 1; cursor: pointer; opacity: .6; }
.tab .x:hover { opacity: 1; background: rgba(255,255,255,.16); }
#newtab { width: 38px; padding: 8px 0; font-size: 1.1rem; }
.toolbar .btn[disabled] { opacity: .35; pointer-events: none; }

/* "page failed" bar */
.retry { display: none; position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 7; max-width: 90%; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 14px; background: var(--plum); border: 1px solid var(--line); color: var(--text); font-size: .88rem; }
.retry.show { display: flex; animation: dropin .35s cubic-bezier(.2,1.2,.3,1) both; }
@keyframes dropin { from { opacity: 0; transform: translate(-50%, -14px); } to { opacity: 1; transform: translate(-50%, 0); } }
.retry .btn { width: auto; padding: 7px 14px; }

/* small animations */
.btn.ghost { transition: transform .4s cubic-bezier(.3,1.7,.5,1), background .25s, box-shadow .25s, filter .2s, opacity .25s; }
input { transition: border-color .25s, box-shadow .25s, background .25s; }
#newtab:hover:not(:active) { transform: rotate(90deg); }
#bk:hover:not([disabled]):not(:active) { transform: translateX(-3px); }
#fw:hover:not([disabled]):not(:active) { transform: translateX(3px); }
.rot { display: inline-block; }
#rl.spin .rot { animation: turn .6s cubic-bezier(.3,1.4,.5,1); }      /* one turn when you press reload */
#rl.loading .rot { animation: spin .8s linear infinite; }              /* keeps turning while the page loads */
@keyframes turn { from { transform: rotate(0); } to { transform: rotate(360deg); } }
.dot.orange { animation: blink 1s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }

@media (max-width: 820px) {
  body { flex-direction: column; }
  aside { position: static; height: auto; width: 100%; flex-direction: row; flex-wrap: wrap; align-items: center; border-right: 0; border-bottom: 1px solid var(--line); }
  .nav { flex-direction: row; flex-wrap: wrap; margin: 0; }
  .nav .sub { display: none; }
  .acct { margin: 0 0 0 auto; border: 0; padding: 0; }
  main { min-height: 0; padding: 14px; }
}
  </style>
</head>

<body>

  <div class="bg"><i></i><i></i><i></i></div>


  <!-- ======================= 3. SIDEBAR ======================= -->
  <aside>
    <div class="logo">pulsixgames<small>proxy</small></div>

    <nav class="nav">
      <button id="back">← Back to games</button>

  <main>

      <button class="btn ghost" id="bk" aria-label="Back">←</button>

      <!-- the new tab page (each tab's own page is an iframe added here by the script) -->

        <h2>New Tab</h2>

        <input id="home-in" placeholder="Search or enter a website" autocomplete="off" spellcheck="false">

          <input id="server-in" placeholder="https://yourname.onrender.com" autocomplete="off" spellcheck="false">
          <button class="btn main" id="server-save">Save</button>

  <!-- ======================= 5. SCRIPT ======================= -->
  <script>
const $ = s => document.querySelector(s);

/* ==========================================================================
   SETTINGS
   SERVER = the address of your proxy server once it is online (see proxy-server.js),
   for example 'https://pulsix-proxy.onrender.com'  (no slash at the end).
   ========================================================================== */
const SERVER = 'https://pulsix-proxy.onrender.com';

// tidies whatever was typed: adds https:// if it is missing and drops any path or trailing slash
const cleanServer = v => {
  v = (v || '').trim();
  if (!v) return '';
  if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
  try { return new URL(v).origin; } catch (e) { return ''; }
};

// an address saved from the box on this page (or from opening  proxy.html?server=https://your-address ) wins over SERVER above
const fromLink = new URLSearchParams(location.search).get('server');
if (fromLink) { try { localStorage.setItem('proxyServer', cleanServer(fromLink)); } catch (e) {} }
let saved = '';
try { saved = localStorage.getItem('proxyServer') || ''; } catch (e) {}

const BASE  = cleanServer(saved) || cleanServer(SERVER);
const PROXY = BASE + '/proxy?url=';
const PING  = BASE + '/ping';
const SEARCH = 'https://html.duckduckgo.com/html/?q=';   // used when you type words instead of an address


/* ==========================================================================
   BROWSING
   ========================================================================== */
// "wikipedia.org" -> https://wikipedia.org,  "cute cats" -> a search
function toUrl(text) {
  text = text.trim();
  if (!text) return '';
  if (/^https?:\/\//i.test(text)) return text;
  if (!/\s/.test(text) && /^[\w-]+(\.[\w-]+)+(:\d+)?([\/?#].*)?$/.test(text)) return 'https://' + text;
  return SEARCH + encodeURIComponent(text);
}

/* ==========================================================================
   TABS  (every tab has its own iframe, its own history and its own title / icon)
   ========================================================================== */
const MAX_TABS = 20;
const tabs = [];              // every open tab, in the order shown
let active = null;            // the tab being shown
let nextId = 1;

const tabOf  = id => tabs.find(t => t.id === id);
const tabFor = win => tabs.find(t => t.iframe && t.iframe.contentWindow === win);   // which tab sent a message
const hostOf = u => { try { return new URL(u).hostname; } catch (e) { return u; } };

// opens a tab; with a url it loads it, otherwise it shows the New Tab page
function createTab(url, opts = {}) {
  if (tabs.length >= MAX_TABS) return null;
  const iframe = document.createElement('iframe');
  iframe.title = 'Page';
  // pages may run scripts and forms, but cannot take over the whole window or open real pop-ups
  iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-downloads allow-modals');
  iframe.allow = 'fullscreen; clipboard-write';

  const tab = { id: 't' + nextId++, url: '', prevUrl: '', title: 'New Tab', favicon: '', history: [], historyIndex: -1,
                loading: false, failed: '', expect: null, timer: 0, iframe };
  iframe.addEventListener('load', () => { if (iframe.getAttribute('src')) { tab.loading = false; updateTab(tab); } });
  $('#view').appendChild(iframe);

  tabs.splice(opts.after ? tabs.indexOf(opts.after) + 1 : tabs.length, 0, tab);
  if (opts.background) renderTabs(); else switchTab(tab.id);

  if (url) { visit(tab, url); loadTab(tab, url); }
  else if (!opts.background) $('#home-in').focus();
  return tab;
}

function closeTab(id) {
  const i = tabs.findIndex(t => t.id === id);
  if (i < 0) return;
  const tab = tabs[i];
  clearTimeout(tab.timer);
  tab.iframe.src = 'about:blank';       // stops anything still loading or playing
  tab.iframe.remove();
  tab.iframe = null;
  tabs.splice(i, 1);

  const el = tabEls.get(id);            // the tab shrinks away, then is removed
  if (el) { tabEls.delete(id); el.classList.add('leaving'); setTimeout(() => el.remove(), 300); }

  if (!tabs.length) return createTab();
  if (tab === active) switchTab((tabs[i] || tabs[i - 1]).id);
  else renderTabs();
}

// shows a tab's own iframe again (nothing is reloaded)
function switchTab(id) {
  const tab = tabOf(id);
  if (!tab) return;
  active = tab;
  refreshToolbar(true);
  renderTabs();
  if (!tab.url) $('#home-in').focus();
}

const tabEls = new Map();     // tab id -> its button on the bar (kept between updates so its animation only plays once)

function makeTabEl(t) {
  const el = document.createElement('div');
  el.className = 'tab enter';
  el.dataset.id = t.id;
  el.innerHTML = '<span class="ico"></span><span class="ttl"></span><button class="x" aria-label="Close tab">×</button>';
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('enter')));   // grows in
  return el;
}

function renderTabs() {
  const bar = $('#tabs');
  let prev = null;
  tabs.forEach(t => {
    let el = tabEls.get(t.id);
    if (!el) { el = makeTabEl(t); tabEls.set(t.id, el); }
    el.classList.toggle('on', t === active);
    el.classList.toggle('loading', t.loading);
    el.title = t.title;
    const ttl = el.querySelector('.ttl');
    if (ttl.textContent !== t.title) ttl.textContent = t.title;

    const key = (t.loading ? 'L' : '') + t.favicon;     // only redraw the icon when it changed
    if (el._key !== key) {
      el._key = key;
      const ico = el.querySelector('.ico');
      ico.replaceChildren();
      if (!t.loading) {
        if (t.favicon) {
          const img = new Image();
          img.alt = '';
          img.onerror = () => { img.remove(); ico.textContent = '🌐'; };
          img.src = t.favicon;
          ico.append(img);
        } else ico.textContent = '🌐';
      }
    }

    const want = prev ? prev.nextElementSibling : bar.firstElementChild;   // keep the bar in tab order
    if (want !== el) bar.insertBefore(el, want);
    prev = el;
  });
  const on = $('#tabs .tab.on');
  if (on) on.scrollIntoView({ inline: 'nearest', block: 'nearest' });
}

// the address bar, Back / Forward, loading bar, Retry bar and New Tab page all follow the active tab
function refreshToolbar(force) {
  const t = active;
  if (!t) return;
  if (force || document.activeElement !== $('#addr')) $('#addr').value = t.url;
  $('#bk').disabled = t.historyIndex <= 0;
  $('#fw').disabled = t.historyIndex >= t.history.length - 1;
  tabs.forEach(x => x.iframe.classList.toggle('on', x === t && !!x.url));   // an empty tab shows the New Tab page instead of a blank frame
  $('#view').classList.toggle('busy', t.loading);
  $('#rl').classList.toggle('loading', t.loading);
  $('#home').classList.toggle('show', !t.url);
  $('#retry').classList.toggle('show', !!t.failed);
  $('#retry-msg').textContent = t.failed;
}

function updateTab(tab) {
  renderTabs();
  if (tab === active) refreshToolbar();
}


/* ==========================================================================
   NAVIGATION  (everything works on one tab at a time)
   ========================================================================== */
function visit(tab, url) {
  tab.history.splice(tab.historyIndex + 1);       // going somewhere new drops the "forward" pages
  tab.history.push(url);
  tab.historyIndex = tab.history.length - 1;
}

function fail(tab, message) {
  clearTimeout(tab.timer);
  tab.loading = false;
  tab.expect = null;
  tab.failed = String(message).slice(0, 200);
  updateTab(tab);
}

// shows a page in this tab's iframe
function loadTab(tab, url) {
  if (!BASE) return needSetup();
  clearTimeout(tab.timer);
  tab.prevUrl = tab.url;
  tab.url = url;
  tab.expect = url;              // the next page report is the answer to this request
  tab.loading = true;
  tab.failed = '';
  tab.title = hostOf(url);
  tab.favicon = '';
  tab.iframe.src = PROXY + encodeURIComponent(url);
  tab.timer = setTimeout(() => fail(tab, 'This page is taking too long. The server may still be waking up.'), 45000);
  updateTab(tab);
}

function go(text) {
  const url = toUrl(text);
  if (!url) return;
  if (!BASE) return needSetup();
  const tab = active || createTab();
  visit(tab, url);
  loadTab(tab, url);
}

function step(d) {
  const tab = active;
  const i = tab.historyIndex + d;
  if (i < 0 || i >= tab.history.length) return;
  tab.historyIndex = i;
  loadTab(tab, tab.history[i]);
}

function reload() {
  const r = $('#rl');                    // one spin of the reload button
  r.classList.remove('spin');
  void r.offsetWidth;
  r.classList.add('spin');
  if (active.url) loadTab(active, active.url);
}


/* ==========================================================================
   MESSAGES FROM THE PAGES  (the proxy server adds a small script to every page)
   ========================================================================== */
window.addEventListener('message', e => {
  const d = e.data;
  if (e.origin !== BASE || !d || typeof d !== 'object' || typeof d.proxyMsg !== 'string') return;
  const tab = tabFor(e.source);
  if (!tab) return;                                   // not one of our tabs

  if (d.proxyMsg === 'page' && typeof d.url === 'string') {
    if (tab.expect !== null && d.url === tab.prevUrl && d.url !== tab.expect) return;   // late message from the page we just left
    clearTimeout(tab.timer);
    tab.loading = false;
    tab.failed = '';
    if (tab.expect !== null) { tab.history[tab.historyIndex] = d.url; tab.expect = null; }   // our own request (a redirect may change the address)
    else if (tab.history[tab.historyIndex] !== d.url) visit(tab, d.url);                       // a link clicked inside the page
    tab.url = d.url;
    tab.title = String(d.title || '').trim().slice(0, 200) || hostOf(d.url);
    tab.favicon = typeof d.icon === 'string' && /^(https?:|data:image\/)/i.test(d.icon) ? d.icon : '';
    updateTab(tab);
  }
  else if (d.proxyMsg === 'open' && typeof d.url === 'string' && /^https?:\/\//i.test(d.url) && d.url.length < 2048) {
    createTab(d.url, { after: tab, background: !!d.bg });
  }
  else if (d.proxyMsg === 'error') {
    tab.title = 'Page failed to load';
    tab.favicon = '';
    fail(tab, d.message || 'Could not load this page.');
  }
  else if (d.proxyMsg === 'key') {
    shortcut(String(d.key), !!d.shift, !!d.alt);
  }
});


/* ==========================================================================
   BUTTONS + KEYBOARD
   ========================================================================== */
const cycle = d => { if (tabs.length > 1) switchTab(tabs[(tabs.indexOf(active) + d + tabs.length) % tabs.length].id); };

// Ctrl + T / W / Tab / Shift+Tab / L / R   (Alt + T / W / arrows too, because browsers keep some Ctrl shortcuts for themselves)
function shortcut(key, shift, alt) {
  const k = key.toLowerCase();
  if (k === 't') createTab();
  else if (k === 'w') closeTab(active.id);
  else if (k === 'l' && !alt) { $('#addr').focus(); $('#addr').select(); }
  else if (k === 'r' && !alt) reload();
  else if ((k === 'tab' && !alt) || (alt && k === 'arrowright')) cycle(shift ? -1 : 1);
  else if (alt && k === 'arrowleft') cycle(-1);
  else return false;
  return true;
}

document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey || e.altKey) || (e.ctrlKey && e.altKey)) return;
  if (shortcut(e.key, e.shiftKey, e.altKey)) e.preventDefault();
});

$('#tabs').addEventListener('click', e => {
  const el = e.target.closest('.tab');
  if (!el) return;
  if (e.target.closest('.x')) closeTab(el.dataset.id); else switchTab(el.dataset.id);
});
$('#tabs').addEventListener('auxclick', e => {       // middle click closes a tab
  const el = e.target.closest('.tab');
  if (el && e.button === 1) { e.preventDefault(); closeTab(el.dataset.id); }
});

$('#newtab').onclick = () => createTab();
$('#bk').onclick = () => step(-1);
$('#fw').onclick = () => step(1);
$('#rl').onclick = reload;
$('#go').onclick = () => go($('#addr').value);
$('#addr').addEventListener('keydown', e => { if (e.key === 'Enter') go($('#addr').value); });
$('#home-in').addEventListener('keydown', e => { if (e.key === 'Enter') { go($('#home-in').value); $('#home-in').value = ''; } });
$('#retry-btn').onclick = reload;
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));

// back to the games menu (works inside the site's game viewer or on its own)
$('#back').onclick = () => {
  try { if (parent !== window) return parent.document.getElementById('homeBtn').click(); } catch (e) {}
  location.href = './site.html';
};


/* ==========================================================================
   IS THE PROXY SERVER THERE?
   ========================================================================== */
const setStatus = (msg, color) => { $('#status').textContent = msg; $('#status-dot').className = 'dot ' + color; };

function needSetup() {
  setStatus('Not set up', 'red');
  $('#warn').textContent = "No proxy server address yet. Paste your server's address below and press Save.";
  $('#server-in').value = BASE;
  $('#setup').classList.add('show');
}

// no-cors: we only need to know the server answers, so a missing CORS header cannot make a working server look offline
async function checkServer() {
  if (!BASE) return needSetup();
  setStatus('Connecting...', 'orange');
  for (let i = 0; i < 4; i++) {        // a sleeping free server can take up to a minute to wake up
    try {
      await fetch(PING, { mode: 'no-cors', signal: AbortSignal.timeout(20000) });
      return setStatus('Proxy ready', 'green');
    } catch (e) {}
  }
  setStatus('Proxy offline', 'red');
  $('#warn').textContent = 'Could not reach the proxy server';
}

$('#server-save').onclick = () => {
  const v = cleanServer($('#server-in').value);
  if (!v) { $('#warn').textContent = 'That does not look like an address. Example: https://yourname.onrender.com'; return; }
  try { localStorage.setItem('proxyServer', v); } catch (e) {}
  location.reload();
};
$('#server-in').addEventListener('keydown', e => { if (e.key === 'Enter') $('#server-save').click(); });

checkServer();
createTab();
  </script>
</body>
</html>
